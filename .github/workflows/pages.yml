name: Publish

# Builds JobEval as one self-contained index.html and
# - publishes it to GitHub Pages on every push to main;
# - attaches it to the GitHub release as jobeval.html when a version tag (v*) is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Keep the single file for the release
        uses: actions/upload-artifact@v4
        with:
          name: jobeval-html
          path: dist/index.html

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jobeval-html

      - name: Attach jobeval.html to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv index.html jobeval.html
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "JobEval $GITHUB_REF_NAME" --notes "Download jobeval.html and double-click it to open JobEval in your browser."
          gh release upload "$GITHUB_REF_NAME" jobeval.html --repo "$GITHUB_REPOSITORY" --clobber
